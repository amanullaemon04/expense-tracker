<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal & Expense Log</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1117; color: #f0f6fc; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; padding: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 8px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .card { background: rgba(22, 27, 34, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; margin-top: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        h2 { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        label { display: block; font-size: 12px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
        input, select { width: 100%; background: #090d16; border: 1px solid #30363d; border-radius: 12px; padding: 12px; font-size: 14px; color: #fff; outline: none; margin-bottom: 14px; }
        input:focus, select:focus { border-color: #10b981; }
        button { cursor: pointer; border: none; font-family: inherit; }
        .btn-primary { width: 100%; background: #059669; color: #fff; font-weight: 600; padding: 12px; border-radius: 12px; font-size: 14px; transition: background 0.2s; }
        .btn-primary:hover { background: #047857; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 500; }
        .badge-meal { background: rgba(16, 185, 129, 0.1); color: #34d399; }
        .badge-expense { background: rgba(244, 63, 94, 0.1); color: #fb7185; }
        .badge-income { background: rgba(99, 102, 241, 0.1); color: #818cf8; }
        .entry-item { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-export { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 12px; font-size: 12px; border-radius: 10px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 100; display: none; }
        .modal.active { display: flex; }
        .modal-box { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; width: 90%; max-width: 360px; }
        .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; }
        .del-btn { background: none; color: #64748b; padding: 6px; }
        .del-btn:hover { color: #fb7185; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .summary-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; }
        .summary-box.full { grid-column: span 2; background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.05)); border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <header>
        <div class="container" style="margin: 0; padding: 0; display: flex; width: 100%; justify-content: space-between; align-items: center;">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <div>
                    <h1 style="font-size: 15px; font-weight: 700; color: #fff;">Meal & Expense Log</h1>
                    <p style="font-size: 11px; color: #94a3b8;">Daily Food & Cost Tracker</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="status-badge" id="netStatus"><span class="dot"></span> Online</span>
                <button onclick="openSettings()" style="background: #1f2937; border: 1px solid #374151; padding: 8px; border-radius: 10px; color: #cbd5e1;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Live Summary Cards -->
        <div class="summary-grid">
            <div class="summary-box">
                <span style="font-size: 11px; color: #94a3b8;">Total Income</span>
                <h3 id="totalIncomeDisplay" style="font-size: 16px; font-weight: 700; color: #818cf8; margin-top: 4px;">৳0.00</h3>
            </div>
            <div class="summary-box">
                <span style="font-size: 11px; color: #94a3b8;">Total Expenses</span>
                <h3 id="totalExpenseDisplay" style="font-size: 16px; font-weight: 700; color: #fb7185; margin-top: 4px;">৳0.00</h3>
            </div>
            <div class="summary-box full">
                <span style="font-size: 11px; color: #34d399; font-weight: 600;">Current Balance (Available)</span>
                <h2 id="netBalanceDisplay" style="font-size: 22px; font-weight: 700; color: #fff; margin-top: 4px;">৳0.00</h2>
            </div>
        </div>

        <!-- Add Entry Form -->
        <section class="card">
            <h2 id="formTitle">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Add Entry
            </h2>

            <form id="entryForm" onsubmit="handleFormSubmit(event)">
                <label>Type</label>
                <select id="type" onchange="updateFormLabels()">
                    <option value="Meal">Meal / Food</option>
                    <option value="Expense">Other Expense</option>
                    <option value="Income">Income / Fund</option>
                </select>

                <label id="descLabel">What did you eat?</label>
                <input type="text" id="description" placeholder="e.g., Chicken Biryani, Morning Tea">

                <label>Amount (৳)</label>
                <input type="number" step="0.01" id="amount" required placeholder="0.00">

                <label>Date</label>
                <input type="date" id="entryDate" required>

                <button type="submit" class="btn-primary">Save Entry</button>
            </form>
        </section>

        <!-- History & Export -->
        <section class="card">
            <div class="flex-between" style="margin-bottom: 12px;">
                <h2 style="margin: 0;">History & Records</h2>
                <button onclick="exportToExcel()" class="btn-export">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Export Excel
                </button>
            </div>

            <input type="date" id="filterDate" onchange="renderEntries()">

            <div id="entriesList" style="margin-top: 10px;">
                <!-- Items -->
            </div>
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-box">
            <h3 style="font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 8px;">Google Sheet Sync Settings</h3>
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">Enter your Google Apps Script Web App URL.</p>
            <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
            <div style="display: flex; gap: 8px;">
                <button onclick="saveSettings()" class="btn-primary" style="padding: 10px;">Save</button>
                <button onclick="closeSettings()" style="background: #374151; color: #fff; border-radius: 12px; padding: 10px; font-weight: 600; width: 100%;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Register Service Worker for Offline PWA Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            fetch(e.request).catch(() => caches.match(e.request).then(res => res || caches.match('./')))
                        );
                    });
                `)).catch(err => console.log('SW registration failed'));
            });
        }

        let entries = JSON.parse(localStorage.getItem('meal_expense_entries')) || [];
        let scriptUrl = localStorage.getItem('google_script_url') || '';

        document.getElementById('entryDate').valueAsDate = new Date();

        function updateFormLabels() {
            const type = document.getElementById('type').value;
            const descLabel = document.getElementById('descLabel');
            const descInput = document.getElementById('description');

            if (type === 'Income') {
                descLabel.innerText = "Source / Note (Optional)";
                descInput.placeholder = "e.g., Pocket Money, Tutoring Salary";
                descInput.required = false;
            } else if (type === 'Expense') {
                descLabel.innerText = "What did you buy?";
                descInput.placeholder = "e.g., Rickshaw Fare, Utilities";
                descInput.required = true;
            } else {
                descLabel.innerText = "What did you eat?";
                descInput.placeholder = "e.g., Chicken Biryani, Morning Tea";
                descInput.required = true;
            }
        }

        function openSettings() {
            document.getElementById('scriptUrlInput').value = scriptUrl;
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            scriptUrl = document.getElementById('scriptUrlInput').value.trim();
            localStorage.setItem('google_script_url', scriptUrl);
            closeSettings();
            alert('Settings saved successfully!');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('type').value;
            let description = document.getElementById('description').value.trim();
            if (!description) {
                description = type === 'Income' ? 'Income / Fund' : 'Expense Item';
            }
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const date = document.getElementById('entryDate').value;

            const newEntry = { id: Date.now(), type, description, amount, date };
            entries.unshift(newEntry);
            localStorage.setItem('meal_expense_entries', JSON.stringify(entries));

            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            renderEntries();
            syncToGoogleSheet(newEntry);
        }

        function deleteEntry(id) {
            entries = entries.filter(item => item.id !== id);
            localStorage.setItem('meal_expense_entries', JSON.stringify(entries));
            renderEntries();
        }

        function updateSummary() {
            let totalIncome = 0;
            let totalExpense = 0;

            entries.forEach(item => {
                if (item.type === 'Income') {
                    totalIncome += item.amount;
                } else {
                    totalExpense += item.amount;
                }
            });

            let netBalance = totalIncome - totalExpense;

            document.getElementById('totalIncomeDisplay').innerText = `৳${totalIncome.toFixed(2)}`;
            document.getElementById('totalExpenseDisplay').innerText = `৳${totalExpense.toFixed(2)}`;
            document.getElementById('netBalanceDisplay').innerText = `৳${netBalance.toFixed(2)}`;
        }

        function renderEntries() {
            updateSummary();
            const listEl = document.getElementById('entriesList');
            const filterDate = document.getElementById('filterDate').value;
            
            let filtered = entries;
            if (filterDate) {
                filtered = entries.filter(item => item.date === filterDate);
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align: center; font-size: 12px; color: #64748b; padding: 15px;">No entries found.</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => {
                let badgeClass = item.type === 'Meal' ? 'badge-meal' : item.type === 'Income' ? 'badge-income' : 'badge-expense';
                return `
                    <div class="entry-item">
                        <div>
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                <span class="badge ${badgeClass}">${item.type}</span>
                                <span style="font-size: 11px; color: #94a3b8;">${item.date}</span>
                            </div>
                            <p style="font-size: 14px; font-weight: 500; color: #fff;">
                                ${item.description} <span style="color: #94a3b8; font-size: 12px;">(৳${item.amount.toFixed(2)})</span>
                            </p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-size: 14px; font-weight: 700; color: ${item.type === 'Income' ? '#818cf8' : '#fff'};">৳${item.amount.toFixed(2)}</span>
                            <button onclick="deleteEntry(${item.id})" class="del-btn">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function exportToExcel() {
            if (entries.length === 0) {
                alert('No data available to export.');
                return;
            }
            const dataToExport = entries.map(e => ({ Date: e.date, Type: e.type, Item: e.description, Amount: e.amount }));
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Meal & Expense Log");
            XLSX.writeFile(workbook, "meal_expense_log.xlsx");
        }

        function syncToGoogleSheet(entry) {
            if (!scriptUrl) return;
            if (!navigator.onLine) return;

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(entry)
            }).catch(err => console.log('Sync failed'));
        }

        updateFormLabels();
        renderEntries();
    </script>
</body>
</html>
