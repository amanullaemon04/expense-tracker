<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal & Expense Log</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js](https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1117; color: #f0f6fc; }
        .glass-card { background: rgba(22, 27, 34, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-shadow { box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-gray-800 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600/20 text-emerald-400 p-2 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">Meal & Expense Log</h1>
                    <p class="text-xs text-gray-400">Daily Food & Cost Tracker</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="netStatus" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Online
                </span>
                <button onclick="openSettings()" class="p-2 glass-card rounded-xl hover:bg-gray-800 text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
        <!-- Add Entry Form -->
        <section class="glass-card rounded-2xl p-5 custom-shadow">
            <h2 class="text-sm font-semibold text-gray-300 mb-4 flex items-center">
                <svg class="w-4 h-4 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Add What You Ate / Spent
            </h2>

            <!-- Quick Presets -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-400 mb-2">Quick Food Presets:</label>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="setPreset('Breakfast', 50)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded-xl border border-gray-700 text-gray-200 transition">🍳 Breakfast (৳50)</button>
                    <button type="button" onclick="setPreset('Lunch', 120)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded-xl border border-gray-700 text-gray-200 transition">🍛 Lunch (৳120)</button>
                    <button type="button" onclick="setPreset('Dinner', 100)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded-xl border border-gray-700 text-gray-200 transition">🍽️ Dinner (৳100)</button>
                    <button type="button" onclick="setPreset('Biryani', 180)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded-xl border border-gray-700 text-gray-200 transition">🍗 Biryani (৳180)</button>
                    <button type="button" onclick="setPreset('Tea & Snacks', 30)" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded-xl border border-gray-700 text-gray-200 transition">☕ Tea & Snacks (৳30)</button>
                </div>
            </div>

            <form id="entryForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Type</label>
                    <select id="type" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="Meal">Meal / Food</option>
                        <option value="Expense">Other Expense</option>
                        <option value="Income">Income / Fund</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">What did you eat / buy?</label>
                    <input type="text" id="description" required placeholder="e.g., Chicken Biryani, Morning Tea" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Amount (৳)</label>
                    <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Date</label>
                    <input type="date" id="entryDate" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <span>Save Entry</span>
                </button>
            </form>
        </section>

        <!-- History & Export -->
        <section class="glass-card rounded-2xl p-5 custom-shadow space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-gray-300">Food & Expense History</h2>
                <button onclick="exportToExcel()" class="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-medium flex items-center space-x-1.5 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>Export Excel</span>
                </button>
            </div>

            <!-- Filter Date -->
            <div>
                <input type="date" id="filterDate" onchange="renderEntries()" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- List Container -->
            <div id="entriesList" class="space-y-3">
                <!-- Dynamic items rendered here -->
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
        <div class="glass-card rounded-2xl p-6 max-w-sm w-full mx-4 space-y-4 border border-gray-700">
            <h3 class="font-bold text-base text-white">Google Sheet Sync Settings</h3>
            <p class="text-xs text-gray-400">Enter your Google Apps Script Web App URL to automatically sync data to Google Sheets.</p>
            <input type="text" id="scriptUrlInput" placeholder="[https://script.google.com/macros/s/.../exec](https://script.google.com/macros/s/.../exec)" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <div class="flex space-x-2">
                <button onclick="saveSettings()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-semibold">Save</button>
                <button onclick="closeSettings()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-xl text-xs font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('meal_expense_entries')) || [];
        let scriptUrl = localStorage.getItem('google_script_url') || '';

        document.getElementById('entryDate').valueAsDate = new Date();

        function setPreset(text, amount) {
            document.getElementById('description').value = text;
            document.getElementById('amount').value = amount;
            document.getElementById('type').value = 'Meal';
        }

        function openSettings() {
            document.getElementById('scriptUrlInput').value = scriptUrl;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            scriptUrl = document.getElementById('scriptUrlInput'].value.trim();
            localStorage.setItem('google_script_url', scriptUrl);
            closeSettings();
            alert('Settings saved successfully!');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const date = document.getElementById('entryDate').value;

            const newEntry = { id: Date.now(), type, description, amount, date };
            entries.unshift(newEntry);
            localStorage.setItem('meal_expense_entries', JSON.stringify(entries));

            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
            renderEntries();
            syncToGoogleSheet(newEntry);
        }

        function deleteEntry(id) {
            entries = entries.filter(item => item.id !== id);
            localStorage.setItem('meal_expense_entries', JSON.stringify(entries));
            renderEntries();
        }

        function renderEntries() {
            const listEl = document.getElementById('entriesList');
            const filterDate = document.getElementById('filterDate').value;
            
            let filtered = entries;
            if (filterDate) {
                filtered = entries.filter(item => item.date === filterDate);
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-gray-500 py-4">No entries found.</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => `
                <div class="bg-gray-900/50 border border-gray-800/80 rounded-xl p-3 flex items-center justify-between">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium ${item.type === 'Meal' ? 'bg-emerald-500/10 text-emerald-400' : item.type === 'Income' ? 'bg-indigo-500/10 text-indigo-400' : 'bg-rose-500/10 text-rose-400'}">${item.type}</span>
                            <span class="text-xs text-gray-400">${item.date}</span>
                        </div>
                        <p class="text-sm font-medium text-white mt-1">
                            ${item.description} <span class="text-gray-400 text-xs">(৳${item.amount.toFixed(2)})</span>
                        </p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-sm font-bold ${item.type === 'Income' ? 'text-indigo-400' : 'text-white'}">৳${item.amount.toFixed(2)}</span>
                        <button onclick="deleteEntry(${item.id})" class="text-gray-500 hover:text-rose-400 p-1 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function exportToExcel() {
            if (entries.length === 0) {
                alert('No data available to export.');
                return;
            }
            const dataToExport = entries.map(e => ({ Date: e.date, Type: e.type, Item: e.description, Amount: e.amount }));
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Meal & Expense Log");
            XLSX.writeFile(workbook, "meal_expense_log.xlsx");
        }

        function syncToGoogleSheet(entry) {
            if (!scriptUrl) return;
            if (!navigator.onLine) return;

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(entry)
            }).catch(err => console.log('Sync failed'));
        }

        renderEntries();
    </script>
</body>
</html>
